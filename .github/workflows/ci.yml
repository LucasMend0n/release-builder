name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore release-builder.csproj

      - name: Lint (dotnet format)
        run: dotnet format release-builder.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build release-builder.csproj -c Release --no-restore
